server {
    listen 80;
    server_name yuanbao.yianso.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name yuanbao.yianso.cn;

    ssl_certificate /etc/letsencrypt/live/yuanbao.yianso.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yuanbao.yianso.cn/privkey.pem;

    client_max_body_size 100m;

    location ^~ /cos/ {
        proxy_pass https://hunyuan-prod-1258344703.cos.accelerate.myqcloud.com/;
        proxy_ssl_server_name on;
        proxy_ssl_name hunyuan-prod-1258344703.cos.accelerate.myqcloud.com;

        proxy_set_header Host hunyuan-prod-1258344703.cos.accelerate.myqcloud.com;
        proxy_set_header Origin https://yuanbao.tencent.com;
        proxy_set_header Referer https://yuanbao.tencent.com/;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass https://yuanbao.tencent.com;
        proxy_ssl_server_name on;
        proxy_ssl_name yuanbao.tencent.com;

        proxy_set_header Host yuanbao.tencent.com;
        proxy_set_header Origin https://yuanbao.tencent.com;
        proxy_set_header Referer https://yuanbao.tencent.com$request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_cookie_domain yuanbao.tencent.com yuanbao.yianso.cn;
        proxy_redirect https://yuanbao.tencent.com/ https://yuanbao.yianso.cn/;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
